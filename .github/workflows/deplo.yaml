name : test needs
on: 
  workflow-dispatch:


jobs: 
  build:
    runs-on: ubuntu-latest
    steps: 
      - run: echo "build stage"

  test :
    runs-on: ubuntu-latest
    needs: build
    steps: 
      - run: echo "test stage"
  lint :
    runs-on: ubuntu-latest
    needs: test
    steps: 
      - run: echo "lint stage"
  deploy :
    runs-on: ubuntu-latest
    needs: 
      - build 
      - lint
      - test
    steps: 
      - run: echo "deploy stage"        
