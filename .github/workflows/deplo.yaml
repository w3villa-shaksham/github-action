name: start learnig github action 
on :
  push:
  workflow_dispatch:

jobs :
  condition-lab:
    runs-on: ubuntu-latest

    steps:      
      - name : run when event is pull request
        if: github.event_name == 'pull_request'
        run : echo " this is always run"

      - name: chekout repo
        uses: actions/checkout@v4

      - name : run when i pushed into main branch 
        if : github.ref == 'refs/heads/main'
        run : echo " this is always run when i pushed into main branch"

      
      - name : run when i pushed into master branch 
        if : github.ref == 'refs/heads/master'
        run : echo " this is always run when i pushed into master branch"
      
      - name : run when i pushed into development branch 
        if : github.ref == 'refs/heads/development'
        run : echo " this is always run when i pushed into development branch"
          
  
        
      