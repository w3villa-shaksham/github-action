name : test needs
on: 
  workflow_dispatch:
    inputs:
      name:
        description: 'Name of the person to greet'
        required: true
        default: "World"
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        default: "dev"
        choice:
          - dev
          - staging
          - prod    

jobs: 
  build:
    runs-on: ubuntu-latest
    steps: 
      - run: echo "build stage"
      - run: echo "${{ inputs.environment }}"

  test :
    runs-on: ubuntu-latest
    needs: build
    steps: 
      - run: echo "test stage"
  lint :
    runs-on: ubuntu-latest
    needs: test
    steps: 
      - run: echo "lint stage"
  deploy :
    runs-on: ubuntu-latest
    needs: 
      - build 
      - lint
      - test
    steps: 
      - run: echo "deploy stage"        
